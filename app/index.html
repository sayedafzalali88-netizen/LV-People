<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LV People</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#17212f;--muted:#64748b;--line:#e2e8f0;--brand:#1f3a5f;--brand2:#2f6fed;--ok:#168a4a;--warn:#b7791f;--bad:#c0392b;--side:#14233a;--sideink:#c9d6ea}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1623;--card:#16223a;--ink:#e6edf7;--muted:#93a4bd;--line:#26344e;--brand:#7fa8ff;--brand2:#4f86f7;--side:#0a1220;--sideink:#b6c4dc}}
:root[data-theme=dark]{--bg:#0e1623;--card:#16223a;--ink:#e6edf7;--muted:#93a4bd;--line:#26344e;--brand:#7fa8ff;--brand2:#4f86f7;--side:#0a1220;--sideink:#b6c4dc}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.inp:focus{outline:2px solid var(--brand2);outline-offset:0}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn-p{background:var(--brand2);border-color:var(--brand2);color:#fff}.btn-s{padding:4px 10px;font-size:12px}.btn-d{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.lbox h1{margin:0 0 4px;font-size:24px;color:var(--brand)}.lbox p{margin:0 0 14px;color:var(--muted)}
.seg{display:flex;gap:6px;margin:12px 0}.seg button{flex:1}.seg .on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--sideink);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side .logo{font-weight:700;font-size:18px;color:#fff;padding:4px 10px 14px}.side small{display:block;font-weight:400;color:var(--sideink);font-size:11px}
.side a{display:block;padding:9px 12px;border-radius:8px;color:var(--sideink);text-decoration:none;margin:2px 0;cursor:pointer}
.side a.on,.side a:hover{background:rgba(255,255,255,.12);color:#fff}
.main{padding:20px 24px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}.top h1{margin:0;font-size:22px;flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--line)}.p-ok{background:#dcfce7;color:#166534}.p-warn{background:#fef3c7;color:#92400e}.p-bad{background:#fee2e2;color:#991b1b}.p-teal{background:#ccfbf1;color:#115e59}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.tw{overflow:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg)}tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.tools .inp{max-width:210px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.cards .card{padding:14px}.cards .n{font-size:26px;font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,32,.55);display:grid;place-items:center;padding:14px;z-index:20;overflow:auto}
.modal{background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:640px;max-height:92vh;overflow:auto}.modal h3{margin:0 0 6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.sec-t{font-weight:600;margin:16px 0 4px;color:var(--brand)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40}
.muted{color:var(--muted)}
.menu-btn{display:none}
@media (max-width:820px){.shell{grid-template-columns:1fr}.side{position:fixed;left:-250px;width:230px;z-index:15;transition:left .2s}.side.open{left:0}.menu-btn{display:inline-block}.main{padding:14px 16px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://okhikmjugdytahgnddjm.supabase.co', SB_KEY='sb_publishable_2rSs43HfAzKoTbqw5_AQkA_7XzAxMv0';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let LANG=(()=>{try{return localStorage.getItem('lv_lang')||'en'}catch(e){return 'en'}})();
const L=(en,hi)=>LANG==='hi'&&hi?hi:en;
const S={user:null,profile:null,client:null,platform:false,page:'home',nav:false,data:{},q:'',fb:'',fs:'',side:false,loading:false};
const isHR=()=>S.platform||['admin','hr'].includes(S.profile&&S.profile.role);
const fmtD=d=>{if(!d)return '—';const x=new Date(d+'T00:00:00');return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function modal(html,onSubmit,wide){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<form class="modal" ${wide?'style="max-width:820px"':''}>${html}</form>`;document.body.appendChild(bg);
  const close=()=>bg.remove();bg.addEventListener('mousedown',e=>{if(e.target===bg)close()});$$('[data-close]',bg).forEach(b=>b.onclick=close);
  const f=$('form',bg);f.onsubmit=async e=>{e.preventDefault();const btn=$('button.btn-p',f);if(btn)btn.disabled=true;try{await onSubmit(f,close,bg)}catch(x){const m=$('#me',bg);if(m)m.textContent=x.message||String(x)}finally{if(btn)btn.disabled=false}};return bg}
async function logAudit(module,action,subject,detail){if(!S.profile)return;await sb.from('audit_log').insert({client_id:S.profile.client_id,user_id:S.user.id,module,action,subject,detail:detail||''})}

/* ---------- start ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){S.user=session.user;await loadMe()}
  render();
}
async function loadMe(){
  const [p,pa]=await Promise.all([sb.from('profiles').select('*, employee:employee_id(name,code), client:client_id(code,name,status,modules,leave_year_start)').eq('user_id',S.user.id).maybeSingle(),sb.from('platform_admins').select('user_id').eq('user_id',S.user.id).maybeSingle()]);
  S.platform=!!(pa.data);S.profile=p.data||null;S.client=p.data?p.data.client:null;
  if(!S.platform&&!S.profile){await sb.auth.signOut();S.user=null;throw new Error('This login is not active')}
  S.page=S.platform?'clients':'home';
}

/* ---------- login ---------- */
let LMODE='client';
function loginView(msg){
  return `<div class="login"><form class="lbox" id="lf"><h1>LV People</h1><p>${L('Sign in to your company account','अपने कंपनी अकाउंट में साइन इन करें')}</p>
  <div class="seg"><button type="button" class="btn ${LMODE==='client'?'on':''}" data-m="client">${L('Company login','कंपनी लॉगिन')}</button><button type="button" class="btn ${LMODE==='platform'?'on':''}" data-m="platform">${L('Platform admin','प्लेटफ़ॉर्म एडमिन')}</button></div>
  ${LMODE==='client'?`<label>${L('Company code','कंपनी कोड')}</label><input class="inp" name="client" autocomplete="organization" placeholder="demo" required><label>${L('Employee code','कर्मचारी कोड')}</label><input class="inp" name="code" autocomplete="username" placeholder="E001" required>`:`<label>Email</label><input class="inp" name="email" type="email" autocomplete="username" required>`}
  <label>${L('Password','पासवर्ड')}</label><input class="inp" name="pw" type="password" autocomplete="current-password" required>
  <div class="err" id="le">${esc(msg||'')}</div><button class="btn btn-p" style="width:100%;margin-top:10px">${L('Sign in','साइन इन')}</button>
  <p class="muted" style="margin-top:14px;font-size:12px;text-align:center"><a href="#" id="lg">${LANG==='hi'?'English':'हिंदी'}</a></p></form></div>`;
}
function bindLogin(){
  $$('[data-m]').forEach(b=>b.onclick=()=>{LMODE=b.dataset.m;render()});
  $('#lg').onclick=e=>{e.preventDefault();LANG=LANG==='hi'?'en':'hi';try{localStorage.setItem('lv_lang',LANG)}catch(x){}render()};
  $('#lf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target), le=$('#le');le.textContent='';const btn=$('button.btn-p',e.target);btn.disabled=true;
    try{const email=LMODE==='client'?`${f.get('code').trim().toLowerCase()}.${f.get('client').trim().toLowerCase()}@login.example.com`:f.get('email').trim();
      const {data,error}=await sb.auth.signInWithPassword({email,password:f.get('pw')});
      if(error)throw new Error(L('Wrong code or password','कोड या पासवर्ड ग़लत है'));
      S.user=data.user;await loadMe();
      if(LMODE==='client'&&!S.profile)throw new Error(L('This login is not active','यह लॉगिन चालू नहीं है'));
      render()}catch(x){await sb.auth.signOut();S.user=null;S.profile=null;S.platform=false;render(x.message)}finally{btn&&(btn.disabled=false)}}
}
async function logout(){await sb.auth.signOut();S.user=null;S.profile=null;S.platform=false;S.data={};render()}

/* ---------- change password ---------- */
function pwView(msg){return `<div class="login"><form class="lbox" id="pf"><h1>${L('Set your password','अपना पासवर्ड बनाएँ')}</h1><p>${L('This is your first sign-in. Choose a new password (at least 8 characters).','यह आपका पहला साइन-इन है। नया पासवर्ड चुनें (कम से कम 8 अक्षर)।')}</p>
 <label>${L('New password','नया पासवर्ड')}</label><input class="inp" type="password" name="a" autocomplete="new-password" required minlength="8"><label>${L('Repeat the password','पासवर्ड दोबारा')}</label><input class="inp" type="password" name="b" autocomplete="new-password" required minlength="8">
 <div class="err" id="pe">${esc(msg||'')}</div><button class="btn btn-p" style="width:100%;margin-top:10px">${L('Save and continue','सेव करें और आगे बढ़ें')}</button></form></div>`}
function bindPw(){$('#pf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target), pe=$('#pe');
  if(f.get('a')!==f.get('b'))return pe.textContent=L('The two passwords are not the same','दोनों पासवर्ड एक जैसे नहीं हैं');
  const {error}=await sb.auth.updateUser({password:f.get('a')});if(error)return pe.textContent=error.message;
  await sb.from('profiles').update({must_change_password:false}).eq('user_id',S.user.id);S.profile.must_change_password=false;toast(L('Password saved','पासवर्ड सेव हुआ'));render()}}

/* ---------- shell ---------- */
const NAV=()=>S.platform?[['clients',L('Clients','क्लाइंट')]]:[['home',L('Home','होम')],['employees',L('Employees','कर्मचारी')],['leave',L('Leave','छुट्टी')],['org',L('Organisation','संगठन')],...(isHR()?[['logins',L('Logins','लॉगिन')]]:[]),['me',L('My profile','मेरी प्रोफ़ाइल')]];
function shell(body){
  const who=S.platform?'LV People · Platform':(S.profile.employee?S.profile.employee.name:S.profile.login_code);
  return `<div class="shell"><aside class="side ${S.side?'open':''}"><div class="logo">LV People<small>${esc(S.platform?L('All clients','सभी क्लाइंट'):S.client.name)}</small></div>
  ${NAV().map(([k,n])=>`<a data-nav="${k}" class="${S.page===k?'on':''}">${n}</a>`).join('')}
  <div style="margin-top:26px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px;font-size:12px"><div style="padding:0 12px;color:#fff">${esc(who)}</div><div style="padding:0 12px 8px">${S.platform?'Platform admin':esc(S.profile.role)}</div><a id="lgo">${L('Sign out','साइन आउट')}</a><a id="lang">${LANG==='hi'?'English':'हिंदी'}</a></div></aside>
  <main class="main"><div class="top"><button class="btn btn-s menu-btn" id="mb">☰</button>${body.head}</div>${body.html}</main></div>`;
}
function bindShell(){
  $$('[data-nav]').forEach(a=>a.onclick=()=>{S.page=a.dataset.nav;S.side=false;S.q='';S.fb='';S.fs='';render()});
  $('#lgo').onclick=logout;$('#lang').onclick=()=>{LANG=LANG==='hi'?'en':'hi';try{localStorage.setItem('lv_lang',LANG)}catch(x){}render()};
  const mb=$('#mb');if(mb)mb.onclick=()=>{S.side=!S.side;$('.side').classList.toggle('open',S.side)};
}

/* ---------- data helpers ---------- */
async function loadOrg(){
  const [b,d,dp,f,g]=await Promise.all(['branches','divisions','departments','job_functions','designations'].map(t=>sb.from(t).select('*').order('name')));
  S.data.branches=b.data||[];S.data.divisions=d.data||[];S.data.departments=dp.data||[];S.data.functions=f.data||[];S.data.designations=g.data||[];
}
async function loadEmps(){
  const {data,error}=await sb.from('employees').select('*').order('code').limit(2000);if(error)throw error;S.data.emps=data||[];
  const {data:pf}=await sb.from('profiles').select('user_id,employee_id,login_code,role,active,must_change_password');S.data.logins=pf||[];
}
const nmOf=(list,id)=>{const x=(S.data[list]||[]).find(r=>r.id===id);return x?x.name:'—'};
const empName=id=>{const e=(S.data.emps||[]).find(r=>r.id===id);return e?e.name:'—'};
const opts=(list,sel,blank)=>`<option value="">${blank||'—'}</option>`+(S.data[list]||[]).filter(x=>x.active!==false||x.id===sel).map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('');

/* ---------- pages ---------- */
async function pageHome(){
  await Promise.all([loadOrg(),loadEmps()]);
  const E=S.data.emps, w=E.filter(e=>e.active), me=S.profile.employee_id?E.find(e=>e.id===S.profile.employee_id):null;
  const byB=S.data.branches.map(b=>[b.name,w.filter(e=>e.branch_id===b.id).length]);
  return {head:`<h1>${L('Home','होम')}</h1>`,html:`<div class="cards"><div class="card"><div class="muted">${L('Working employees','कार्यरत कर्मचारी')}</div><div class="n">${w.length}</div></div><div class="card"><div class="muted">${L('Branches','शाखाएँ')}</div><div class="n">${S.data.branches.length}</div></div><div class="card"><div class="muted">${L('Left or relieved','छोड़ चुके')}</div><div class="n">${E.length-w.length}</div></div></div>
  ${me?`<div class="card" style="padding:16px;margin-bottom:16px"><b>${L('Welcome','स्वागत है')}, ${esc(me.name)}</b><div class="muted">${esc(me.code)} · ${esc(nmOf('designations',me.designation_id))} · ${esc(nmOf('branches',me.branch_id))}</div></div>`:''}
  <div class="card tw"><table><thead><tr><th>${L('Branch','शाखा')}</th><th>${L('Working employees','कार्यरत')}</th></tr></thead><tbody>${byB.map(([n,c])=>`<tr><td>${esc(n)}</td><td>${c}</td></tr>`).join('')}</tbody></table></div>`};
}
async function pageEmployees(){
  await Promise.all([loadOrg(),loadEmps()]);
  const q=S.q.toLowerCase(), rows=S.data.emps.filter(e=>(!S.fb||e.branch_id===S.fb)&&(!S.fs||(S.fs==='W'?e.active:!e.active))&&(!q||[e.name,e.code,e.mobile].join(' ').toLowerCase().includes(q)));
  const lg=id=>S.data.logins.find(l=>l.employee_id===id);
  return {head:`<h1>${L('Employees','कर्मचारी')} <span class="muted" style="font-size:14px">${rows.length}</span></h1>${isHR()?`<button class="btn btn-p" id="addE">+ ${L('Add employee','कर्मचारी जोड़ें')}</button>`:''}`,
  html:`<div class="tools"><input class="inp" id="q" placeholder="${L('Search name, code, mobile','नाम, कोड, मोबाइल खोजें')}" value="${esc(S.q)}"><select class="inp" id="fb"><option value="">${L('All branches','सभी शाखाएँ')}</option>${S.data.branches.map(b=>`<option value="${b.id}" ${S.fb===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select><select class="inp" id="fs"><option value="">${L('All','सभी')}</option><option value="W" ${S.fs==='W'?'selected':''}>${L('Working','कार्यरत')}</option><option value="L" ${S.fs==='L'?'selected':''}>${L('Left','छोड़ चुके')}</option></select></div>
  <div class="card tw"><table><thead><tr><th>${L('Code','कोड')}</th><th>${L('Name','नाम')}</th><th>${L('Designation','पद')}</th><th>${L('Branch','शाखा')}</th><th>${L('Reports to','रिपोर्टिंग')}</th><th>${L('Status','स्थिति')}</th><th>${L('Login','लॉगिन')}</th></tr></thead><tbody>${rows.map(e=>{const l=lg(e.id);return `<tr class="click" data-e="${e.id}"><td>${esc(e.code)}</td><td><b>${esc(e.name)}</b></td><td>${esc(nmOf('designations',e.designation_id))}</td><td>${esc(nmOf('branches',e.branch_id))}</td><td>${esc(empName(e.manager_id))}</td><td><span class="pill ${e.active?'p-ok':'p-warn'}">${esc(e.status)}</span></td><td>${l?`<span class="pill ${l.active?'p-teal':'p-bad'}">${esc(l.role)}</span>`:'—'}</td></tr>`}).join('')||`<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">${L('No employee found','कोई कर्मचारी नहीं मिला')}</td></tr>`}</tbody></table></div>`};
}
function bindEmployees(){
  $('#q').oninput=e=>{S.q=e.target.value;clearTimeout(bindEmployees.t);bindEmployees.t=setTimeout(()=>render(true),250)};
  $('#fb').onchange=e=>{S.fb=e.target.value;render()};$('#fs').onchange=e=>{S.fs=e.target.value;render()};
  $$('tr[data-e]').forEach(r=>r.onclick=()=>empModal(r.dataset.e));
  const a=$('#addE');if(a)a.onclick=()=>empForm(null);
}
async function empModal(id){
  const e=S.data.emps.find(x=>x.id===id), canSee=isHR()||S.profile.employee_id===id;
  let pr=null;if(canSee){const r=await sb.from('employee_private').select('*').eq('employee_id',id).maybeSingle();pr=r.data}
  const row=(a,b)=>`<tr><td class="muted" style="width:42%">${a}</td><td style="white-space:normal">${b==null||b===''?'—':esc(b)}</td></tr>`;
  const em=(e.emergency||[]).map(x=>`${x.name} · ${x.relation} · ${x.mobile}`).join('; ');
  const bg=modal(`<h3>${esc(e.name)} <span class="muted" style="font-size:13px">${esc(e.code)}</span></h3>
  <div class="sec-t">${L('Work','काम')}</div><table>${row(L('Designation','पद'),nmOf('designations',e.designation_id))}${row(L('Division','डिवीज़न'),nmOf('divisions',e.division_id))}${row(L('Department','विभाग'),nmOf('departments',e.department_id))}${row(L('Branch','शाखा'),nmOf('branches',e.branch_id))}${row(L('Reports to','रिपोर्टिंग'),empName(e.manager_id))}${row(L('Date of joining','जॉइनिंग'),fmtD(e.doj))}${row(L('Status','स्थिति'),e.status+(e.lwd?' · '+fmtD(e.lwd):''))}</table>

  const [c,e]=await Promise.all([sb.from('clients').select('*').order('created_at'),sb.from('employees').select('client_id,active')]);
  const cnt=id=>(e.data||[]).filter(x=>x.client_id===id&&x.active).length;
  return {head:`<h1>${L('Clients','क्लाइंट')}</h1>`,html:`<div class="card tw"><table><thead><tr><th>${L('Company code','कंपनी कोड')}</th><th>${L('Name','नाम')}</th><th>${L('Status','स्थिति')}</th><th>${L('Employees','कर्मचारी')}</th><th>${L('Limit','सीमा')}</th><th>${L('Modules','मॉड्यूल')}</th></tr></thead><tbody>${(c.data||[]).map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.name)}</td><td><span class="pill ${x.status==='active'?'p-ok':'p-warn'}">${esc(x.status)}</span></td><td>${cnt(x.id)}</td><td>${x.employee_limit}</td><td style="white-space:normal">${esc((x.modules||[]).join(', '))}</td></tr>`).join('')}</tbody></table></div><p class="muted" style="margin-top:12px">${L('Creating a new client and its KPI pack comes in the next steps.','नया क्लाइंट और उसका KPI पैक अगले चरणों में आएगा।')}</p>`};
}

/* ---------- leave ---------- */
S.ltab='mine';S.lf='';
const ltName=t=>LANG==='hi'&&t.name_hi?t.name_hi:t.name;
const stPill=s=>`<span class="pill ${s==='approved'?'p-ok':s==='rejected'||s==='cancelled'?'p-bad':'p-warn'}">${({approved:L('Approved','मंज़ूर'),rejected:L('Rejected','अस्वीकार'),cancelled:L('Cancelled','रद्द'),pending:L('Pending','लंबित')})[s]||s}</span>`;
const dRange=r=>fmtD(r.from_date)+(r.to_date!==r.from_date?' – '+fmtD(r.to_date):'');
async function loadLeave(){
  const [t,h,r]=await Promise.all([sb.from('leave_types').select('*').order('code'),sb.from('holidays').select('*').order('hdate'),sb.from('leave_requests').select('*').order('from_date',{ascending:false}).limit(1000)]);
  if(r.error)throw r.error;S.data.ltypes=t.data||[];S.data.holidays=h.data||[];S.data.lreq=r.data||[];
}
const canDecide=r=>r.status==='pending'&&r.employee_id!==S.profile.employee_id&&(isHR()||(S.data.emps||[]).some(e=>e.id===r.employee_id&&e.manager_id===S.profile.employee_id));
async function pageLeave(){
  await Promise.all([loadOrg(),loadEmps(),loadLeave()]);
  const me=S.profile.employee_id, D=S.data, tn=id=>{const t=D.ltypes.find(x=>x.id===id);return t?ltName(t):'—'};
  const mineR=D.lreq.filter(r=>r.employee_id===me), wait=D.lreq.filter(canDecide), hrView=isHR(), isMgr=D.emps.some(e=>e.manager_id===me);
  const tabs=[['mine',L('My leave','मेरी छुट्टी')],...((hrView||isMgr)?[['approve',L('Approvals','मंज़ूरी')+(wait.length?` (${wait.length})`:'')]]:[]),...(hrView?[['all',L('All requests','सभी माँगें')],['setup',L('Setup','सेटअप')]]:[])];
  if(!tabs.some(t=>t[0]===S.ltab))S.ltab='mine';
  let body='';
  const table=(rows,opt)=>`<div class="card tw"><table><thead><tr>${opt.emp?`<th>${L('Employee','कर्मचारी')}</th>`:''}<th>${L('Type','प्रकार')}</th><th>${L('Dates','तारीख़')}</th><th>${L('Days','दिन')}</th><th>${L('Reason','कारण')}</th><th>${L('Status','स्थिति')}</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr>${opt.emp?`<td><b>${esc(empName(r.employee_id))}</b></td>`:''}<td>${esc(tn(r.type_id))}</td><td>${dRange(r)}</td><td>${r.days}${r.half?' ('+L('half','आधा')+')':''}</td><td style="white-space:normal;max-width:240px">${esc(r.reason||'')}${r.comment?`<small class="muted" style="display:block">${esc(r.comment)}</small>`:''}</td><td>${stPill(r.status)}</td><td style="text-align:right;white-space:nowrap">${opt.dec&&canDecide(r)?`<button class="btn btn-p btn-s" data-lok="${r.id}">${L('Approve','मंज़ूर')}</button> <button class="btn btn-s btn-d" data-lno="${r.id}">${L('Reject','अस्वीकार')}</button>`:''}${opt.cancel&&(r.employee_id===me||hrView)&&(r.status==='pending'||(r.status==='approved'&&r.from_date>todayS()))?` <button class="btn btn-s" data-lcan="${r.id}">${L('Cancel','रद्द करें')}</button>`:''}</td></tr>`).join('')||`<tr><td colspan="7" class="muted" style="text-align:center;padding:22px">${L('Nothing here','यहाँ कुछ नहीं')}</td></tr>`}</tbody></table></div>`;
  if(S.ltab==='mine'){
    let bal=[];if(me){const b=await sb.rpc('leave_balance',{p_employee:me});if(b.error)throw b.error;bal=b.data||[]}
    body=me?`<div class="cards">${bal.map(b=>`<div class="card"><div class="muted">${esc(LANG==='hi'&&b.name_hi?b.name_hi:b.name)}</div><div class="n">${b.quota>0?b.available:'—'}</div><div class="muted" style="font-size:12px">${b.quota>0?`${L('of','में से')} ${b.quota} · ${L('used','लिए')} ${b.used} · ${L('pending','लंबित')} ${b.pending}`:`${L('used','लिए')} ${b.used} · ${L('no limit','सीमा नहीं')}`}</div></div>`).join('')}</div>${table(mineR,{cancel:true})}`:`<p class="muted">${L('No employee record is linked to this login.','इस लॉगिन से कोई कर्मचारी रिकॉर्ड नहीं जुड़ा।')}</p>`;
  }else if(S.ltab==='approve'){body=table(wait,{emp:true,dec:true})}
  else if(S.ltab==='all'){const q=S.q.toLowerCase();const rows=D.lreq.filter(r=>(!S.lf||r.status===S.lf)&&(!q||empName(r.employee_id).toLowerCase().includes(q)));
    body=`<div class="tools"><input class="inp" id="q" placeholder="${L('Search employee','कर्मचारी खोजें')}" value="${esc(S.q)}"><select class="inp" id="lfs"><option value="">${L('All','सभी')}</option>${['pending','approved','rejected','cancelled'].map(s=>`<option value="${s}" ${S.lf===s?'selected':''}>${s}</option>`).join('')}</select></div>${table(rows,{emp:true,dec:true,cancel:true})}`}
  else{
    body=`<div class="card tw" style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:10px;padding:14px 16px 0"><h3 style="margin:0;flex:1">${L('Leave types','छुट्टी के प्रकार')}</h3><button class="btn btn-p btn-s" id="ltnew">+ ${L('Add','जोड़ें')}</button></div><table><thead><tr><th>${L('Code','कोड')}</th><th>${L('Name','नाम')}</th><th>${L('Per year','सालाना')}</th><th>${L('Paid','वेतन सहित')}</th><th>${L('Half day','आधा दिन')}</th><th></th></tr></thead><tbody>${D.ltypes.map(t=>`<tr style="${t.active?'':'opacity:.5'}"><td><b>${esc(t.code)}</b></td><td>${esc(t.name)}</td><td>${t.yearly_quota>0?t.yearly_quota:L('no limit','सीमा नहीं')}</td><td>${t.paid?'✓':'—'}</td><td>${t.allow_half?'✓':'—'}</td><td style="text-align:right"><button class="btn btn-s" data-lted="${t.id}">${L('Edit','बदलें')}</button></td></tr>`).join('')}</tbody></table><p class="muted" style="padding:0 16px 12px;font-size:12px">${L('The leave year starts in month','छुट्टी का साल शुरू होता है महीना')} ${S.client.leave_year_start||4}. ${L('Leave days do not count company holidays and the weekly off of the employee.','छुट्टी के दिनों में कंपनी की छुट्टियाँ और कर्मचारी का साप्ताहिक ऑफ नहीं गिना जाता।')}</p></div>
    <div class="card tw"><div style="display:flex;align-items:center;gap:10px;padding:14px 16px 0"><h3 style="margin:0;flex:1">${L('Company holidays','कंपनी की छुट्टियाँ')}</h3><button class="btn btn-p btn-s" id="hnew">+ ${L('Add','जोड़ें')}</button></div><table><thead><tr><th>${L('Date','तारीख़')}</th><th>${L('Holiday','छुट्टी')}</th><th></th></tr></thead><tbody>${D.holidays.map(h=>`<tr><td>${fmtD(h.hdate)}</td><td><b>${esc(h.name)}</b></td><td style="text-align:right"><button class="btn btn-s btn-d" data-hdel="${h.id}">${L('Delete','हटाएँ')}</button></td></tr>`).join('')}</tbody></table></div>`;
  }
  return {head:`<h1>${L('Leave','छुट्टी')}</h1>${S.ltab==='mine'&&me?`<button class="btn btn-p" id="lapply">+ ${L('Apply for leave','छुट्टी माँगें')}</button>`:''}`,html:`<div class="tools">${tabs.map(([k,n])=>`<button class="btn ${S.ltab===k?'btn-p':''}" data-lt="${k}">${n}</button>`).join('')}</div>${body}`};
}
const todayS=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function leaveDays(emp,from,to,half){const wo=(emp&&emp.weekly_off)||'0', hs=new Set((S.data.holidays||[]).map(h=>h.hdate));let n=0;for(let d=new Date(from+'T00:00:00Z'),e=new Date(to+'T00:00:00Z');d<=e;d.setUTCDate(d.getUTCDate()+1)){const s=d.toISOString().slice(0,10);if(String(d.getUTCDay())!==wo&&!hs.has(s))n++}return half&&n>0?0.5:n}
function applyForm(){
  const today=todayS(), me=S.data.emps.find(e=>e.id===S.profile.employee_id);
  const bg=modal(`<h3>${L('Apply for leave','छुट्टी माँगें')}</h3><label>${L('Leave type','प्रकार')}</label><select class="inp" name="type">${S.data.ltypes.filter(t=>t.active).map(t=>`<option value="${t.id}">${esc(ltName(t))}</option>`).join('')}</select>
  <div class="fgrid"><div><label>${L('From','से')}</label><input class="inp" type="date" name="from" value="${today}" required></div><div><label>${L('To','तक')}</label><input class="inp" type="date" name="to" value="${today}" required></div></div>
  <label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" name="half"> ${L('Half day (one date only)','आधा दिन (सिर्फ़ एक तारीख़)')}</label><label>${L('Reason','कारण')}</label><input class="inp" name="reason">
  <p id="pv" class="muted" style="margin-top:10px"></p><div class="err" id="me"></div><div class="acts"><button type="button" class="btn" data-close>${L('Cancel','रद्द')}</button><button class="btn btn-p">${L('Send','भेजें')}</button></div>`,
  async(f,close)=>{const d=Object.fromEntries(new FormData(f));const r=await sb.rpc('apply_leave',{p_type:d.type,p_from:d.from,p_to:d.to,p_half:!!d.half,p_reason:d.reason||null});if(r.error)throw r.error;close();toast(L('Sent for approval','मंज़ूरी के लिए गया'));render()});
  const f=$('form',bg), pv=()=>{const d=Object.fromEntries(new FormData(f));if(!d.from||!d.to||d.to<d.from){$('#pv',bg).textContent=L('Check the dates','तारीख़ जाँचें');return}$('#pv',bg).textContent=`${L('Days counted','गिने गए दिन')}: ${leaveDays(me,d.from,d.to,!!d.half)}`};
  f.oninput=pv;f.onchange=pv;pv();
}
function rejectForm(id){modal(`<h3>${L('Reject','अस्वीकार')}</h3><label>${L('Reason (the employee will see it)','कारण (कर्मचारी को दिखेगा)')} *</label><textarea class="inp" name="c" rows="3"></textarea><div class="err" id="me"></div><div class="acts"><button type="button" class="btn" data-close>${L('Cancel','रद्द')}</button><button class="btn btn-p">${L('Reject','अस्वीकार')}</button></div>`,async(f,close)=>{const r=await sb.rpc('decide_leave',{p_request:id,p_approve:false,p_comment:new FormData(f).get('c')});if(r.error)throw r.error;close();toast(L('Rejected','अस्वीकार'));render()})}
function ltForm(id){const t=id?S.data.ltypes.find(x=>x.id===id):{active:true,paid:true,allow_half:true,yearly_quota:0};
  modal(`<h3>${id?L('Edit leave type','प्रकार बदलें'):L('New leave type','नया प्रकार')}</h3><div class="fgrid"><div><label>${L('Code','कोड')} *</label><input class="inp" name="code" value="${esc(t.code||'')}" maxlength="6" required ${id?'readonly':''} style="text-transform:uppercase"></div><div><label>${L('Per year (0 = no limit)','सालाना (0 = सीमा नहीं)')}</label><input class="inp" type="number" name="q" min="0" max="365" step="0.5" value="${t.yearly_quota}"></div></div>
  <label>${L('Name','नाम')} *</label><input class="inp" name="name" value="${esc(t.name||'')}" required><label>${L('Name in Hindi','हिंदी में नाम')}</label><input class="inp" name="hi" value="${esc(t.name_hi||'')}">
  ${[['paid',L('Paid leave','वेतन सहित')],['allow_half',L('Half day allowed','आधा दिन मान्य')],['active',L('Active','चालू')]].map(([k,n])=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" name="${k}" ${t[k]?'checked':''}> ${n}</label>`).join('')}<div class="err" id="me"></div><div class="acts"><button type="button" class="btn" data-close>${L('Cancel','रद्द')}</button><button class="btn btn-p">${L('Save','सेव')}</button></div>`,
  async(f,close)=>{const d=Object.fromEntries(new FormData(f));const row={code:d.code.trim().toUpperCase(),name:d.name.trim(),name_hi:d.hi.trim()||null,yearly_quota:+d.q||0,paid:!!d.paid,allow_half:!!d.allow_half,active:!!d.active};if(!row.code||!row.name)throw new Error(L('Write the code and name','कोड और नाम लिखें'));
    const r=id?await sb.from('leave_types').update(row).eq('id',id):await sb.from('leave_types').insert({...row,client_id:S.profile.client_id});if(r.error)throw new Error(r.error.code==='23505'?L('This code already exists','यह कोड पहले से है'):r.error.message);await logAudit('Leave','Type saved',row.code,'');close();toast(L('Saved','सेव हुआ'));render()})}
function holidayForm(){modal(`<h3>${L('Add a holiday','छुट्टी जोड़ें')}</h3><label>${L('Date','तारीख़')}</label><input class="inp" type="date" name="d" required><label>${L('Holiday','छुट्टी')}</label><input class="inp" name="n" required><div class="err" id="me"></div><div class="acts"><button type="button" class="btn" data-close>${L('Cancel','रद्द')}</button><button class="btn btn-p">${L('Save','सेव')}</button></div>`,
  async(f,close)=>{const d=Object.fromEntries(new FormData(f));const r=await sb.from('holidays').insert({client_id:S.profile.client_id,hdate:d.d,name:d.n.trim()});if(r.error)throw new Error(r.error.code==='23505'?L('This date already has a holiday','इस तारीख़ की छुट्टी पहले से है'):r.error.message);await logAudit('Leave','Holiday added',d.d,d.n);close();toast(L('Saved','सेव हुआ'));render()})}
function bindLeave(){
  $$('[data-lt]').forEach(b=>b.onclick=()=>{S.ltab=b.dataset.lt;S.q='';render()});
  const a=$('#lapply');if(a)a.onclick=applyForm;
  $$('[data-lok]').forEach(b=>b.onclick=async()=>{b.disabled=true;const r=await sb.rpc('decide_leave',{p_request:b.dataset.lok,p_approve:true,p_comment:null});if(r.error){toast(r.error.message);b.disabled=false;return}toast(L('Approved','मंज़ूर'));render()});
  $$('[data-lno]').forEach(b=>b.onclick=()=>rejectForm(b.dataset.lno));
  $$('[data-lcan]').forEach(b=>b.onclick=async()=>{if(!confirm(L('Cancel this leave?','यह छुट्टी रद्द करें?')))return;const r=await sb.rpc('cancel_leave',{p_request:b.dataset.lcan});if(r.error)return toast(r.error.message);toast(L('Cancelled','रद्द हुआ'));render()});
  const q=$('#q');if(q)q.oninput=e=>{S.q=e.target.value;clearTimeout(bindLeave.t);bindLeave.t=setTimeout(()=>render(true),250)};const fs=$('#lfs');if(fs)fs.onchange=e=>{S.lf=e.target.value;render()};
  const n=$('#ltnew');if(n)n.onclick=()=>ltForm(null);$$('[data-lted]').forEach(b=>b.onclick=()=>ltForm(b.dataset.lted));const h=$('#hnew');if(h)h.onclick=holidayForm;
  $$('[data-hdel]').forEach(b=>b.onclick=async()=>{if(!confirm(L('Delete this holiday?','यह छुट्टी हटाएँ?')))return;const r=await sb.from('holidays').delete().eq('id',b.dataset.hdel);if(r.error)return toast(r.error.message);toast(L('Deleted','हटाया'));render()});
}

/* ---------- render ---------- */
const PAGES={home:[pageHome,()=>{}],employees:[pageEmployees,bindEmployees],leave:[pageLeave,bindLeave],org:[pageOrg,bindOrg],logins:[pageLogins,bindLogins],me:[pageMe,bindMe],clients:[pageClients,()=>{}]};
let RTOKEN=0;
async function render(keepFocus,msg){
  const app=$('#app'), tok=++RTOKEN;
  if(typeof keepFocus==='string'){msg=keepFocus;keepFocus=false}
  if(!S.user){app.innerHTML=loginView(msg);bindLogin();return}
  if(S.profile&&S.profile.must_change_password&&!S.platform){app.innerHTML=pwView();bindPw();return}
  try{const [fn,bind]=PAGES[S.page]||PAGES.home, body=await fn();if(tok!==RTOKEN)return;
    const ae=document.activeElement, id=ae&&ae.id, pos=ae&&ae.selectionStart;
    app.innerHTML=shell(body);bindShell();bind(body);
    if(keepFocus&&id){const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
  }catch(x){app.innerHTML=shell({head:'<h1>Error</h1>',html:`<div class="card" style="padding:16px;color:var(--bad)">${esc(x.message||x)}</div>`});bindShell()}
}
boot().catch(x=>{S.user=null;render(x.message)});
</script>
</body>
</html>
